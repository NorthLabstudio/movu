<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MOVU | Login</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" href="assets/img/logomovu.png" type="image/png">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>


<body>

  <div class="container" id="container">


    <!-- =========================
             LOGIN
        ========================== -->

    <section class="form-container login">

      <form id="login-form">

        <h1>Iniciar Sesión</h1>


        <div class="social-icons">

          <a href="#" aria-label="Facebook">
            <i class="fab fa-facebook-f"></i>
          </a>

          <a href="#" aria-label="Twitter">
            <i class="fab fa-twitter"></i>
          </a>

          <a href="#" aria-label="Google">
            <i class="fab fa-google"></i>
          </a>

        </div>


        <p>o</p>


        <input type="email" id="login-email" placeholder="Ingrese su correo" required>


        <input type="password" id="login-password" placeholder="Ingrese su contraseña" required>


        <a href="#" id="forgot-password">
          ¿Olvidaste tu contraseña?
        </a>


        <button type="submit">
          Iniciar Sesión
        </button>

      </form>

    </section>



    <!-- =========================
             SIGN UP
        ========================== -->

    <section class="form-container signup">

      <form id="signup-form">

        <h1>Crear Cuenta</h1>


        <div class="social-icons">

          <a href="#" aria-label="Facebook">
            <i class="fab fa-facebook-f"></i>
          </a>

          <a href="#" aria-label="Twitter">
            <i class="fab fa-twitter"></i>
          </a>

          <a href="#" aria-label="Google">
            <i class="fab fa-google"></i>
          </a>

        </div>


        <p>o</p>
        <input type="text" id="name" placeholder="Ingrese su nombre" required>


        <input type="email" id="signup-email" placeholder="Ingrese su correo" required>


        <input type="password" id="signup-password" placeholder="Ingrese su contraseña" required>


        <button type="submit">
          Crear Cuenta
        </button>

      </form>

    </section>



    <!-- =========================
             TOGGLE
        ========================== -->

    <div class="toggle-container">

      <div class="toggle">


        <!-- LOGIN PANEL -->

        <div class="toggle-panel toggle-left">

          <h1>¿Tienes una cuenta?</h1>

          <p>
            Inicia sesión en tu cuenta.
          </p>

          <button id="login" class="hidden" type="button">
            Iniciar Sesión
          </button>

        </div>



        <!-- SIGN UP PANEL -->

        <div class="toggle-panel toggle-right">

          <h1>¿No tienes una cuenta?</h1>

          <p>
            Crea una cuenta.
          </p>

          <button id="signup" class="hidden" type="button">
            Crear Cuenta
          </button>

        </div>


      </div>

    </div>


  </div>


  <!-- JavaScript -->

  <script src="js/login.js"></script>

</body>

</html>
