<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovuLogin</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="assets/img/logomovu.png" type="image/x-icon">
  <link
    href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="container" id="container">
    <section class="form-container login">
      <form action="">
        <h1>Iniciar Sesion</h1>
        <div class="Social-icons">
          <i class="fab fa-facebook-f"></i>
          <i class="fab fa-twitter"></i>
          <i class="fab fa-google-plus-g"></i>
        </div>
        <p>o</p>
        <input type="text" placeholder="Ingrese su correo">
        <input type="password" placeholder="Ingrese su contraseña">
        <a href="#">Forgot your password?</a>

        <button type="submit">Iniciar Sesion</button>

      </form>
    </section>
  </div>
  <section class="form-container signup">
    <form action="">
      <h1>Crear Cuenta</h1>
      <div class="Social-icons">
        <i class="fab fa-facebook-f"></i>
        <i class="fab fa-twitter"></i>
        <i class="fab fa-google-plus-g"></i>
      </div>
      <p>o</p>
      <input type="text" placeholder="Ingrese su correo">
      <input type="password" placeholder="Ingrese su contraseña">
      <button type="submit">Crear Cuenta</button>
    </form>

  </section>
  <div class="toggle-container">
    <div class="toggle">
      <div class="toggle-panel toggle-left">
        <h1>¿Tienes una cuenta?</h1>
        <p>Inicia Sesion en tu cuenta.</p>
        <button id="login" class="hidden">Iniciar Sesion</button>
      </div>
      <div class="toggle-panel toggle-right">
        <h1>¿No tienes una cuenta?</h1>
        <p>Crear cuenta.</p>
        <button id="signup" class="hidden">Crear Cuenta</button>
      </div>
    </div>
  </div>
  </div>

</body>

</html>
