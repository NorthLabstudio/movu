<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOVU | MI PERFIL</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="icon" href="assets/img/logomovu.png" type="image/x-icon">
  <link
    href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <nav>
      <div id="logo-container" src="dashboard.html" class="link">
        <div id="logo-image">
          <img id="logo" src="assets/img/logomovu.png" alt="Movu">
        </div>
        <h2>Movu</h2>
      </div>
      <a href="catalogo.html" class="link">Directorio</a>
      <div>
        <a href="profile.html" class="link">Perfil</a>
        <button class="close-btn">Cerrar sesión</button>
      </div>
    </nav>
  </header>
  <main id="profile-main">
    <section id="profile-header">
      <div id="profile-headerimg">
        <img src="https://example.com/avatar.jpg" alt="Avatar">
      </div>
      <div id="profile-header-right">
        <h1>Mi Cuenta</h1>
        <p>Nombre de Usuario: usuario123</p>
        <p>Email: usuario@example.com</p>
      </div>
      <div id="profileedit">
        <button>Editar Perfil</button>
      </div>
    </section>
    <section id="universidad">
      <h2>Mi Universidad</h2>
      <p>Nombre de la Universidad</p>
      <p>Localización de la Universidad</p>
      <button>Editar Universidad</button>
    </section>
    <section id="rutas favoritas">
      <h2>Rutas Favoritas</h2>
    </section>
    <section id="historial-rutas">
      <h2>Historial de Rutas</h2>
    </section>
    <section id="configuracion">
      <button>Configuración</button>
      <div class="settingitem">
        <p>Notificaciones</p>
      </div>
      <div class="settingitem">
        <p>Privacidad</p>
      </div>
      <div class="settingitem">
        <p>Seguridad</p>
      </div>
    </section>
  </main>
  <footer></footer>

</body>

</html>
